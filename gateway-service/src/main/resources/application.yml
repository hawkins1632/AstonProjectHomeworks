server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userService
                    statusCodes: 500,502,503,504
                    fallbackUri: forward:/fallback

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/api/notifications/**
              filters:
                - RewritePath=/api/notifications/(?<segment>.*), /api/notification/$\{segment}
                - name: CircuitBreaker
                  args:
                    name: notificationService
                    statusCodes: 500,502,503,504
                    fallbackUri: forward:/fallback

            - id: user-service-api-docs
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service(?<segment>.*), /v3/api-docs$\{segment}

            - id: notification-service-api-docs
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - RewritePath=/v3/api-docs/notification-service(?<segment>.*), /v3/api-docs$\{segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        wait-duration-in-half-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      notificationService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        wait-duration-in-half-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  timelimiter:
    instances:
      userService:
        timeout-duration: 3s
      notificationService:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: notification-service
        url: /v3/api-docs/notification-service

logging:
  level:
    root: WARN
    org.gateway: INFO
